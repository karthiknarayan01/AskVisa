# --- priority dates: visa_bulletin -------------------------------------------------------

[[case]]
id = "visa-bulletin-not-current"
question = "My priority date is May 1, 2013, EB-2, and I was born in India. Is it current?"
must_call = ["visa_bulletin"]
judge = [
    "Says the priority date is not current under the final action date (January 1, 2013)",
    "Says it is earlier than the dates for filing cutoff (July 15, 2013), so it may allow filing an I-485 if USCIS uses that chart this month",
    "Does not assume which chart USCIS is using without saying it needs checking",
]

[[case]]
id = "visa-bulletin-current"
split = "held_out"
question = "EB-3, rest of world, my priority date is June 2023. Is it current?"
must_call = ["visa_bulletin"]
judge = ["Says the priority date is current under the final action date (September 1, 2023)"]

[[case]]
id = "bulletin-unreachable"
split = "held_out"
question = "What's the EB-2 China final action date this month?"
must_call = ["visa_bulletin"]
judge = [
    "Does not state an EB-2 China final action date",
    "Says the bulletin couldn't be retrieved, and suggests travel.state.gov or trying again",
]
[case.fixtures.visa_bulletin]
error = "couldn't reach the lookup service: ConnectError: no route to host"


