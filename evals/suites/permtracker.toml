[[case]]
id = "uscis-receipt-is-not-dol"
question = "Can you check my I-485 status? My receipt number is IOE0912345678."
must_not_call = ["perm_case_status", "perm_decision_estimate"]
judge = [
    "Explains that this is a USCIS receipt number, which it can't look up with its DOL case tools",
    "Points the user to USCIS's own case status check, or says it can't check USCIS case status",
    "Does not invent a case status",
]


# --- PERM timing: perm_decision_estimate, perm_queue -------------------------------------

[[case]]
id = "estimate-from-date"
question = "My PERM was filed on March 10, 2026. When will it be approved?"
must_call = ["perm_decision_estimate"]
judge = [
    "Gives the estimated range (late December 2026 to late February 2027), not only a single date",
    "Says it is an estimate, not a DOL prediction or a guarantee",
]
[case.args.perm_decision_estimate]
filed_date = "2026-03-10"
[case.fixtures.perm_decision_estimate]
output = '''Department of Labor data as of 2026-11-06; when you use it, end the answer with "Data: PERM Tracker (https://permtracker.app)"
{"filed": "2026-03-10", "estimate": "2027-01-18", "range": {"earliest": "2026-12-20", "latest": "2027-02-25"}, "basis": "cases filed in the same month are being decided at the current analyst review pace", "caveats": ["An audit or a request for information adds months.", "DOL's pace changes from month to month."]}'''

