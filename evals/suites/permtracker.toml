# Evals for the DOL tools (permtracker_tools.py): does the model pick the right tool, pass the
# right arguments, stay away from tools that don't fit, and handle failures without inventing
# data? Fixtures are written in the tools' real output format: a date line, a match note for
# match_employer, then the data as JSON. The numbers are made up for the evals.

[suite]
name = "permtracker"
today = "2026-11-07"
tools = ["perm", "perm_keyed", "web"]

[defaults.web_search]
output = "No results."

[defaults.read_web_page]
output = "(the page has no text)"

[defaults.visa_bulletin]
output = '''Department of Labor data as of 2026-11-01; when you use it, end the answer with "Data: PERM Tracker (https://permtracker.app)"
{"month": "2026-11", "employment": {"finalAction": {"EB1": {"all": "C", "china": "2023-01-01", "india": "2022-02-01"}, "EB2": {"all": "2024-04-01", "china": "2021-01-01", "india": "2013-01-01"}, "EB3": {"all": "2023-09-01", "china": "2021-03-01", "india": "2013-06-15"}}, "datesForFiling": {"EB1": {"all": "C", "china": "2023-06-01", "india": "2022-08-01"}, "EB2": {"all": "2024-10-01", "china": "2021-07-01", "india": "2013-07-15"}, "EB3": {"all": "2024-01-01", "china": "2021-09-01", "india": "2014-01-01"}}}}'''


# --- employer sponsorship: match_employer ------------------------------------------------

[[case]]
id = "employer-sponsors"
question = "Does Infosys sponsor green cards?"
must_call = ["match_employer"]
max_calls = 3
judge = [
    "Says Infosys has sponsored green cards through PERM, using numbers from the tool result",
    "Does not promise or predict that the user's own case will be approved",
]
[case.args.match_employer]
name = "infosys"
[case.fixtures.match_employer]
output = '''Department of Labor data as of 2026-11-06; when you use it, end the answer with "Data: PERM Tracker (https://permtracker.app)"
Match: exact. The numbers below are this employer's record.
{"query": "Infosys", "match": "exact", "employer": {"name": "Infosys Limited", "slug": "infosys-limited", "permDecisions": 4210, "certifiedShare": 0.97, "pendingCases": 812, "newestFiling": "2026-10-28", "filingsLast12Months": 1350, "lcaCount": 21450, "pwdCount": 2900}}'''

[[case]]
id = "employer-possible-match"
question = "Does Acme sponsor H-1B visas?"
must_call = ["match_employer"]
judge = [
    "Names the employer that was found (Acme Robotics Inc) and asks the user to confirm it is their employer",
    "Does not present the numbers as definitely the user's employer's record",
]
[case.fixtures.match_employer]
output = '''Department of Labor data as of 2026-11-06; when you use it, end the answer with "Data: PERM Tracker (https://permtracker.app)"
Match: possible. Tell the user which employer this is (name and any location) and ask them to confirm it is theirs before relying on the numbers.
{"query": "Acme", "match": "possible", "employer": {"name": "Acme Robotics Inc", "city": "Boston, MA", "slug": "acme-robotics-inc", "permDecisions": 38, "certifiedShare": 0.92, "pendingCases": 6, "newestFiling": "2026-09-02", "filingsLast12Months": 11, "lcaCount": 214, "pwdCount": 25}}'''

[[case]]
id = "employer-no-match"
split = "held_out"
question = "Will Zeta Widgets Co sponsor my green card?"
must_call = ["match_employer"]
judge = [
    "Says no PERM record was found under that name",
    "Says this is not proof the employer never sponsors",
    "Asks for the employer's legal name (for example from an offer letter or pay stub)",
]
[case.fixtures.match_employer]
output = '''Department of Labor data as of 2026-11-06; when you use it, end the answer with "Data: PERM Tracker (https://permtracker.app)"
Match: none. No PERM record under this name. That is not proof the employer never sponsors: filings are under the legal name, so ask for it (on an offer letter or pay stub) and look it up again.
{"query": "Zeta Widgets Co", "match": "none", "employer": null}'''

