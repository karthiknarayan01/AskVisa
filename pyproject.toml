[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "askvisa"
version = "0.1.0"
description = "AskVisa: an assistant for US immigration questions about visas, status, green cards and citizenship"
requires-python = ">=3.11"
dependencies = ["anthropic>=0.40", "openai>=1.50", "jsonschema>=4", "ddgs>=9", "rich>=13", "ollama>=0.6", "httpx>=0.27", "fastapi>=0.115", "uvicorn>=0.30", "websockets>=13"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
askvisa-server = "runtime.server:main"
askvisa-migrate = "runtime.migrate:main"
askvisa-eval = "evals.cli:main"

[tool.setuptools.packages.find]
include = ["runtime*", "evals*"]

[tool.setuptools.package-data]
"runtime.migrations" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
